<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Contact | Louis Lin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --blue-accent: #3b82f6;
            --focus-ring: #8b5cf6;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-page); 
            background-image: linear-gradient(to right, rgba(186, 230, 253, 0.35) 0%, rgba(255, 255, 255, 0) 15%, rgba(255, 255, 255, 0) 85%, rgba(186, 230, 253, 0.35) 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            line-height: 1.6; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        :focus:not(:focus-visible) { outline: none; }
        :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 4px; }
        
        /* Navigation */
        nav { position: sticky; top: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); z-index: 100; }
        .nav-container { max-width: 1000px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .nav-brand { font-weight: 600; font-size: 1.1rem; text-decoration: none; color: var(--text-main); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        .btn-linkedin { background-color: var(--blue-accent); color: white !important; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; text-decoration: none; }
        
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; }

        /* Contact Layout */
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 1.5rem; text-align: center; }
        .contact-card { max-width: 500px; }
        h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 1rem; letter-spacing: -0.03em; }
        p { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 2.5rem; }
        
        .btn-email { display: inline-flex; align-items: center; gap: 0.5rem; background-color: var(--text-main); color: white; padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem; font-weight: 500; text-decoration: none; transition: background-color 0.2s, transform 0.2s; }
        .btn-email:hover { background-color: #000000; transform: translateY(-2px); }
        
        footer { border-top: 1px solid var(--border); padding: 2rem 1.5rem; margin-top: auto; }
        .footer-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.85rem; }

        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            .nav-links { display: none; flex-direction: column; width: 100%; position: absolute; top: 100%; left: 0; background: rgba(255, 255, 255, 0.98); border-bottom: 1px solid var(--border); padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
            .nav-links.active { display: flex; }
            .btn-linkedin { text-align: center; width: 100%; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Louis Lin</a>
            <button class="mobile-menu-btn" aria-label="Toggle menu">☰</button>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="experiences.html">Experiences</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="https://www.linkedin.com/in/louis-lin-43164a328" target="_blank" class="btn-linkedin">LinkedIn</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="contact-card">
            <h1>Let's Connect</h1>
            <p>I am actively seeking opportunities in mechanical engineering, system integration, and hardware development. Reach out directly to discuss projects or roles.</p>
            <a href="mailto:hello@louislin.dev" class="btn-email">Send an Email</a>
        </div>
    </main>

    <footer>
        <div class="footer-content"><span>© 2026 Louis Lin</span><span>Built with GitHub Pages</span></div>
    </footer>

    <script>
        document.querySelector('.mobile-menu-btn').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('active');
        });
    </script>
</body>
</html>
